name: WorkBuddy 每日签到

on:
  schedule:
    - cron: "5 16 * * *"   # 北京时间 00:05 (UTC 16:05)
    - cron: "0 0 * * *"    # 北京时间 08:00 (UTC 00:00)
  workflow_dispatch:        # 可手动触发
    inputs:
      force_fail:
        description: "测试用：跳过签到直接失败，用来验证告警 issue 链路是否真的通"
        type: boolean
        default: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 开 issue 告警需要 issues: write；显式声明权限，不用默认的宽松授权
    permissions:
      contents: read
      issues: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # signin.py 只认「凭据文件路径」——环境变量 WORKBUDDY_AUTH_FILE，或四个平台默认
      # 路径。它不认识 WORKBUDDY_AUTH_JSON 这个变量名，所以把 secret 直接挂在 env 里
      # 不会生效（历史失败全部是 NO_AUTH）。这里先落盘成桌面端同名的凭据文件：
      # $HOME/.workbuddy/auth/workbuddy-desktop.info 正是脚本的兜底探测路径。
      - name: 准备登录凭据
        env:
          WORKBUDDY_AUTH_JSON: ${{ secrets.WORKBUDDY_AUTH_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${WORKBUDDY_AUTH_JSON:-}" ]; then
            echo "::error::Secret WORKBUDDY_AUTH_JSON 为空。请在仓库 Settings > Secrets and variables > Actions 中填入 workbuddy-desktop.info 的完整 JSON 内容。"
            exit 1
          fi

          AUTH_FILE="$HOME/.workbuddy/auth/workbuddy-desktop.info"
          mkdir -p "$(dirname "$AUTH_FILE")"
          printf '%s' "$WORKBUDDY_AUTH_JSON" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"

          # 提前校验格式，把「token 过期 / 粘错内容」和「代码逻辑问题」区分开。
          # 注意字段位置：令牌在 auth.accessToken，账号在 account.uid（不是 auth.uid，
          # 写成 auth.uid 会在 build_headers 里被判 NO_SESSION）。
          python - "$AUTH_FILE" <<'PY'
          import datetime
          import json
          import sys

          path = sys.argv[1]
          try:
              with open(path, "r", encoding="utf-8") as f:
                  session = json.load(f)
          except Exception as exc:
              print("::error::Secret 不是合法 JSON（%s）。应填入 workbuddy-desktop.info 的完整原文内容，"
                    "而不是单独的 token 字符串。" % exc)
              sys.exit(1)

          auth = session.get("auth") or {}
          account = session.get("account") or {}
          if not auth.get("accessToken") or not account.get("uid"):
              print("::error::凭据缺少 auth.accessToken 或 account.uid，请从本机 "
                    "%LOCALAPPDATA%\\CodeBuddyExtension\\Data\\Public\\auth\\workbuddy-desktop.info "
                    "重新复制完整内容后更新 Secret。")
              sys.exit(1)

          uid = str(account.get("uid"))
          masked = uid[:4] + "****" + uid[-4:] if len(uid) > 8 else "****"
          exp = auth.get("expiresAt")
          if isinstance(exp, (int, float)):
              when = datetime.datetime.fromtimestamp(exp / 1000, datetime.timezone.utc)
              left = when - datetime.datetime.now(datetime.timezone.utc)
              if left.days < 0:
                  print("::warning::凭据校验通过（uid=%s），但 accessToken 已于 %s 过期，"
                        "运行大概率会返回 NO_SESSION，请重新登录桌面端并更新 Secret。"
                        % (masked, when.strftime("%Y-%m-%d")))
              else:
                  print("凭据校验通过：uid=%s accessToken 到期=%s（约剩 %s 天）"
                        % (masked, when.strftime("%Y-%m-%d"), left.days))
                  if left.days < 3:
                      print("::warning::accessToken 将在 3 天内过期，请重新登录桌面端并更新 Secret，"
                            "否则后续运行会变成 NO_SESSION。")
          else:
              print("凭据校验通过：uid=%s（凭据未提供 expiresAt，无法预判过期）" % masked)
          PY

      # 这一步不再注入 secret：脚本通过 WORKBUDDY_AUTH_FILE 指向的文件读凭据，
      # 最小化敏感值暴露面。
      - name: 执行签到
        run: |
          if [ "${{ inputs.force_fail }}" = "true" ]; then
            echo "::error::force_fail=true：跳过签到直接失败，用于验证「失败开 issue」链路。"
            exit 1
          fi
          export WORKBUDDY_AUTH_FILE="$HOME/.workbuddy/auth/workbuddy-desktop.info"
          python signin.py silent

      - name: 输出日志
        if: always()
        run: |
          if [ -f signin.log ]; then
            cat signin.log
          else
            echo "signin.log 不存在，检查上面步骤的输出"
          fi

      - name: 清理凭据
        if: always()
        run: rm -f "$HOME/.workbuddy/auth/workbuddy-desktop.info"

      # 告警放在同一个 job 内：能直接读到 signin.log 里的失败原因，不必再传 artifact。
      # 失败 → 在没有未关闭告警 issue 时新建，否则追加评论（避免每天刷出两条新 issue）；
      # 成功 → 自动关闭历史告警，恢复即销警。
      # 用 python3 而不是 python：即使 setup-python 没跑成，runner 自带的 python3 也在。
      - name: 失败告警 / 成功销警
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import subprocess

          STATUS = os.environ.get("JOB_STATUS", "")
          REPO = os.environ.get("GITHUB_REPOSITORY", "")
          TITLE = "[自动签到] 运行失败"
          RUN_URL = os.environ.get("RUN_URL", "")
          BODY_FILE = pathlib.Path("issue-body.md")


          def gh(*args):
              """调用 gh CLI；失败时把 stderr 原样抛出，别把告警问题再静默吞掉。"""
              return subprocess.run(["gh", *args], check=True, text=True, capture_output=True)


          def find_open_issue():
              raw = gh("issue", "list", "--repo", REPO, "--state", "open",
                       "--limit", "100", "--json", "number,title").stdout or "[]"
              for item in json.loads(raw):
                  if item.get("title") == TITLE:
                      return item.get("number")
              return None


          def failure_body():
              tail = ""
              log = pathlib.Path("signin.log")
              if log.exists():
                  text = log.read_text(encoding="utf-8", errors="replace").strip()
                  if text:
                      tail = text[-2000:]
              if not tail:
                  tail = ("没有 signin.log：脚本在写日志之前就退出了（多半卡在准备凭据步骤），"
                          "请打开本次运行记录看前面的步骤日志。")

              now = datetime.datetime.now(datetime.timezone.utc)
              bj = now.astimezone(datetime.timezone(datetime.timedelta(hours=8)))
              return (
                  "## 自动签到运行失败\n\n"
                  "| 项 | 值 |\n"
                  "| --- | --- |\n"
                  "| 时间（北京时间） | %s |\n" % bj.strftime("%Y-%m-%d %H:%M:%S")
                  + "| 触发方式 | `%s` |\n" % os.environ.get("TRIGGER", "")
                  + "| 运行记录 | %s |\n\n" % RUN_URL
                  + "<details><summary>signin.log 末尾</summary>\n\n"
                  + "```\n%s\n```\n\n" % tail
                  + "</details>\n\n"
                  + "_修好之后，第一次成功运行会自动关闭本 issue。_\n"
              )


          if STATUS == "failure":
              BODY_FILE.write_text(failure_body(), encoding="utf-8")
              num = find_open_issue()
              if num:
                  gh("issue", "comment", str(num), "--repo", REPO,
                     "--body-file", str(BODY_FILE))
                  print("已把本次失败追加到告警 issue #%s" % num)
              else:
                  created = gh("issue", "create", "--repo", REPO, "--title", TITLE,
                               "--body-file", str(BODY_FILE)).stdout.strip()
                  print("已创建告警 issue：%s" % created)
          elif STATUS == "success":
              num = find_open_issue()
              if num:
                  gh("issue", "close", str(num), "--repo", REPO,
                     "--comment", "本次运行已成功（%s），自动关闭该告警。" % RUN_URL)
                  print("已关闭历史告警 issue #%s" % num)
              else:
                  print("运行成功，且没有未关闭的告警 issue。")
          else:
              print("任务状态为 %s，不处理告警。" % (STATUS or "未知"))
          PY
